quarkus.application.name=shoplab

# Banco
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

# Flyway: um histórico global, schemas por módulo
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=catalog,orders,payments,shared
quarkus.flyway.create-schemas=true

# Produção: tudo via variável de ambiente
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# OpenAPI sempre visível (projeto de estudo)
quarkus.swagger-ui.always-include=true

# ViaCep client config
quarkus.rest-client.viacep.url=https://viacep.com.br
quarkus.rest-client.viacep.connect-timeout=1000
quarkus.rest-client.viacep.read-timeout=2000

# Shipping config
shoplab.shipping.default-rate=39.90
shoplab.shipping.rates.SP=15.90
shoplab.shipping.rates.RJ=17.90
shoplab.shipping.rates.MG=17.90
shoplab.shipping.rates.BA=19.90
shoplab.shipping.rates.PE=22.90